[project]
name = "sleeper-service"
version = "0.1.0"
description = "Agent as a Service — a self-hosted platform for fleets of narrow, single-purpose AI agents exposed as API endpoints."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "typer>=0.12",
    "pwdlib[argon2]>=0.2",
    "cryptography>=42.0",
    "email-validator>=2.0",
]

[project.scripts]
sleeper = "sleeper_service.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_service"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer dependency-injection defaults are the framework idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by alembic — don't fight the generator's formatting
"migrations/versions/*" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
package = true

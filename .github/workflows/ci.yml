name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway credentials for the throwaway services below. There are no
    # shipped defaults, so CI names them once and both ends use the same pair.
    env:
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
      REDIS_PASSWORD: ci-redis-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sleeper
          POSTGRES_PASSWORD: sleeper
          POSTGRES_DB: sleeper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sleeper" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Service containers cannot pass server commands, so these start as
      # steps: MinIO needs `server /data`, and Redis needs `requirepass`.
      - name: Start Redis
        run: |
          docker run -d --name sleeper-ci-redis -p 6379:6379 \
            -e REDIS_PASSWORD="$REDIS_PASSWORD" \
            redis:7-alpine sh -c 'exec redis-server --requirepass "$REDIS_PASSWORD"'
          until docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" \
            sleeper-ci-redis redis-cli ping | grep -q PONG; do sleep 1; done
      - name: Start MinIO
        run: >
          docker run -d -p 9000:9000
          -e MINIO_ROOT_USER=$MINIO_ACCESS_KEY -e MINIO_ROOT_PASSWORD=$MINIO_SECRET_KEY
          minio/minio server /data
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway credentials for the throwaway MinIO below. There is no shipped
    # default for these, so CI names them once and both ends use the same pair.
    env:
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sleeper
          POSTGRES_PASSWORD: sleeper
          POSTGRES_DB: sleeper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sleeper" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # a service container can't pass a command, so MinIO starts as a step
      - name: Start MinIO
        run: >
          docker run -d -p 9000:9000
          -e MINIO_ROOT_USER=$MINIO_ACCESS_KEY -e MINIO_ROOT_PASSWORD=$MINIO_SECRET_KEY
          minio/minio server /data
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
